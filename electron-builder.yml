appId: com.pratham.labledger
productName: Pratham Lab Ledger
directories:
  output: release
files:
  - electron/**/*
  - package.json
extraResources:
  # Backend runtime: built code, dependencies, prisma client, and the
  # existing .env — copied as-is, never modified.
  - from: backend/dist
    to: backend/dist
  - from: backend/node_modules
    to: backend/node_modules
  - from: backend/prisma
    to: backend/prisma
  - from: backend/.env
    to: backend/.env
  - from: backend/package.json
    to: backend/package.json
  # Built frontend server + client assets, staged by scripts/prepare-desktop.cjs
  # from whatever `yarn build` actually produced (dist/ or .output/).
  - from: desktop-frontend
    to: frontend
win:
  target:
    - nsis
  # Real .ico generated from public/lab-logo.png (see README-desktop.md).
  icon: build/icon.ico
nsis:
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pratham Lab Ledger
